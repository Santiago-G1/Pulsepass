spring:
  application:
    name: pulsepass

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pulsepass}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

pulsepass:
  jwt:
    secret-base64: ${PULSEPASS_JWT_SECRET_BASE64:TWVkaW9uZ2xvYmFsQmFzZTY0U2VjcmV0U2VjdXJpdHlLZXk=}
    issuer: pulsepass-api
    expiration-seconds: 900